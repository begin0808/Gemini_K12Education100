<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gemini-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="star-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="15" fill="url(#gemini-bg)"/>
  <!-- Gemini Sparkle Star -->
  <path d="M 32 9 Q 32 32 55 32 Q 32 32 32 55 Q 32 32 9 32 Q 32 32 32 9 Z" fill="#ffffff" filter="url(#star-glow)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
